backend:
  name: git-gateway
  branch: main

media_folder: "images/properties"
public_folder: "/images/properties"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/hero.json"
        label: "Homepage Hero"
        name: "hero"
        fields:
          - {label: "Headline — line 1", name: "heroLine1", widget: "string", required: false, hint: "Leave blank to keep the current text"}
          - {label: "Headline — line 2 (shown in gold)", name: "heroLine2", widget: "string", required: false}
          - {label: "Subtext", name: "heroSubtext", widget: "text", required: false}
          - {label: "Background photo", name: "heroImage", widget: "image", required: false, media_folder: "/images/hero", public_folder: "/images/hero"}
          - {label: "Background video (overrides photo — MP4, under ~10MB)", name: "heroVideo", widget: "file", required: false, media_folder: "/images/hero", public_folder: "/images/hero"}

      - file: "content/contact-info.json"
        label: "Contact Info"
        name: "contact"
        fields:
          - {label: "Email", name: "email", widget: "string", required: false}
          - {label: "Phone", name: "phone", widget: "string", required: false}
          - {label: "WhatsApp number (digits with country code, e.g. 971501234567 — no + or spaces)", name: "whatsapp", widget: "string", required: false}
          - {label: "Address line 1", name: "addressLine1", widget: "string", required: false}
          - {label: "Address line 2", name: "addressLine2", widget: "string", required: false}
          - {label: "City", name: "city", widget: "string", required: false}
          - {label: "Country", name: "country", widget: "string", required: false}
          - label: "Google Maps embed URL"
            name: "mapEmbedUrl"
            widget: "string"
            required: false
            hint: "In Google Maps: search your address → Share → the 'Embed a map' tab (not 'Copy link') → copy ONLY the URL inside src=\"...\" and paste it here"
          - {label: "Instagram URL", name: "instagramUrl", widget: "string", required: false}
          - {label: "Amit Thakur Instagram URL", name: "amitInstagramUrl", widget: "string", required: false, hint: "Shows an Instagram icon next to his name on the Home and About pages"}
          - {label: "Amit Thakur Facebook URL", name: "amitFacebookUrl", widget: "string", required: false}
          - {label: "Amit Thakur YouTube URL", name: "amitYoutubeUrl", widget: "string", required: false}
          - {label: "Amit Thakur LinkedIn URL", name: "amitLinkedinUrl", widget: "string", required: false}

      - file: "content/about-content.json"
        label: "About Page"
        name: "about"
        fields:
          - {label: "Quote heading", name: "quoteHeading", widget: "text", required: false, hint: "The big quote at the top of the About page"}
          - {label: "Story paragraph", name: "storyParagraph", widget: "text", required: false}
          - {label: "Our promise", name: "promiseText", widget: "string", required: false}
          - {label: "How we work", name: "howWeWorkText", widget: "text", required: false}
          - label: "Core values"
            name: "values"
            widget: "list"
            required: false
            hint: "Leave empty to keep the current 5 values. Adding any entry here replaces all of them."
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "string"}

      - file: "content/categories.json"
        label: "Browse-by-Category Tiles"
        name: "categories"
        fields:
          - {label: "Buy — title", name: "buyTitle", widget: "string", required: false}
          - {label: "Buy — description", name: "buyDescription", widget: "text", required: false}
          - {label: "Rent — title", name: "rentTitle", widget: "string", required: false}
          - {label: "Rent — description", name: "rentDescription", widget: "text", required: false}
          - {label: "Off-Plan — title", name: "offPlanTitle", widget: "string", required: false}
          - {label: "Off-Plan — description", name: "offPlanDescription", widget: "text", required: false}

  - name: "properties"
    label: "Properties"
    files:
      - file: "content/properties.json"
        label: "Property Listings"
        name: "properties"
        fields:
          - label: "Listings"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.developer}} — {{fields.location}}"
            fields:
              - {label: "ID (unique, e.g. p81 — never reuse one)", name: "id", widget: "string"}
              - {label: "Project name", name: "title", widget: "string"}
              - {label: "Developer (type it exactly as in the other listings, e.g. DAMAC)", name: "developer", widget: "string"}
              - {label: "Location", name: "location", widget: "string"}
              - label: "Status (Ready = handover up to Q3 2026, Off-Plan = Q4 2026 onwards)"
                name: "status"
                widget: "select"
                options:
                  - {label: "Ready to Move In", value: "Ready"}
                  - {label: "Off-Plan", value: "Off-Plan"}
              - {label: "Handover (e.g. Q4 2027)", name: "handover", widget: "string"}
              - {label: "Unit types (e.g. Studio – 3 BR) — optional", name: "unitTypes", widget: "string", required: false}
              - {label: "Starting price (AED, numbers only)", name: "price", widget: "number", value_type: "int"}
              - {label: "Payment plan (e.g. 60/40%) — leave blank if not listed", name: "paymentPlan", widget: "string", required: false}
              - {label: "Tag (e.g. Resale) — optional", name: "tag", widget: "string", required: false}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Amenities (one per line) — optional", name: "amenities", widget: "list", required: false}
              - {label: "Photo (optional — the developer logo shows if left empty)", name: "image", widget: "image", required: false}

[build]
  publish = "."
  functions = "netlify/functions"

# These are only ever read server-side inside the Netlify Function at
# request time (process.env.X) -- they're never written into any file
# or bundled into client-side JS, since this site has no build step.
# Netlify's secrets scanner doesn't know that and flags them anyway, so
# this tells it to skip checking for these specific values.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "LEADRAT_API_KEY,LEADRAT_KEY_AMIT_THAKUR,LEADRAT_KEY_GAUTHAM_NANDU,LEADRAT_KEY_VIDHI_NANDA,LEADRAT_KEY_DIGVIJAY_CHARAN,LEADRAT_KEY_RAMESH_MALOTH,LEADRAT_KEY_AFTAB_KHAN,LEADRAT_KEY_FAHIM_KHAN,LEADRAT_KEY_MAHEBUB_RADHANPURI,LEADRAT_KEY_LALIT_SINGH,LEADRAT_KEY_BHARTI_MANCHANDA"
